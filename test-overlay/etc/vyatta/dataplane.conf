# Default dataplane configuration
# Controller on same machine over loopback
[Controller]
ip=127.0.0.1
certificate = /etc/vyatta/controller.cert
publish=ipc:///var/run/vyatta/vplaned.pub
request=ipc:///var/run/vyatta/vplaned.req

[Authentication]
method = none

[Dataplane]
# TEST IMAGE ONLY -- keeps the first NIC on its kernel driver so it can serve
# as an out-of-band management port. The DANOS test suites clear the dataplane
# configuration as their first step ("delete interfaces dataplane"), which
# takes the management path down with it when management shares a dataplane
# port. Excluding one NIC gives the suites something they can safely wipe.
#
# This has to be in place before the first boot: vplane-uio resolves the
# names here through /sys/class/net/<name>/device, and by the time the
# dataplane service runs the NICs are already unbound, so a name added later
# resolves to nothing and the exclusion is skipped without a word.
#
# The names are the ones the kernel uses at boot -- ensN, matching the PCI
# slot -- not the dp0sN names, which the dataplane assigns to its own ports
# afterwards. Naming a dp0sN port here matches nothing and fails silently.
#
# Two names are listed because vplane-uio splits this on commas and skips any
# entry with no /sys/class/net/<name>/device, so one image serves both a
# one-NIC and a two-NIC management setup. Every listed name that DOES exist is
# excluded, so only slots reserved for management may appear here: the DANOS
# test suites need dp0s3, dp0s8, dp0s9 and dp0s10 as dataplane ports, and
# listing ens3 would silently take dp0s3 away from them.
exclude-interfaces=ens31,ens30
ip=127.0.0.1
certificate = /etc/vyatta/dataplane.cert
uuid = 00000000-0000-0000-0000-000000000000
control=ipc:///var/run/vyatta/dataplane.control

[Rib]
control=ipc:///var/run/routing/rib.control

[xfrm_client]
pull=ipc:///var/run/vyatta/xfrm_pull.ipc
push=ipc:///var/run/vyatta/xfrm_push.ipc

[sfpd_update]
file=/var/run/vyatta/sfpd-presence
url=ipc:///var/run/vyatta/sfp_monitor.socket
