name: Build ISO

# Scheduled ISO build that runs entirely on GitHub, independent of the local
# build host. It builds from an existing, immutable R2 snapshot (the apt
# repository close-the-loop.sh publishes after OBS is all green) and does not
# touch OBS or R2 write credentials, so it needs no secrets. A Codespace cannot
# do this job: it has no scheduler and sleeps when idle. A GitHub-hosted runner
# can, and is free for a public repository.
#
# What it does not do: boot the image (QEMU acceptance) or run the Robot suites.
# Those stay in toolkit/release/close-the-loop.sh and vm/regression.sh.
on:
  schedule:
    - cron: '17 2 * * 1'   # Mondays 02:17 UTC
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'R2 snapshot timestamp (default: the one named by snapshots/LATEST)'
        required: false
        default: ''
      publish:
        description: 'Publish the accepted product ISO as a public GitHub pre-release'
        type: boolean
        default: false
      regression:
        description: 'Also run the Robot regression (81 cases) on the test ISO'
        type: boolean
        default: false

permissions:
  contents: read

env:
  R2_DOMAIN: https://r2.aikon.qzz.io
  REPO_CHANNEL: '2608'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [product, test]
    steps:
      - uses: actions/checkout@v4

      # A hosted runner has ~14 GB free; a build needs about 10. Drop what
      # this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null || true
          df -h /

      - name: Resolve the snapshot
        id: snap
        run: |
          ts="${{ github.event.inputs.snapshot }}"
          if [ -z "$ts" ]; then
            # Query string against a CDN that has served stale indices before.
            ts=$(curl -fsS --retry 5 --retry-delay 5 "$R2_DOMAIN/danos-apt/$REPO_CHANNEL/snapshots/LATEST?t=$(date +%s)" | tr -d '[:space:]')
          fi
          echo "$ts" | grep -Eq '^[0-9]{8}T[0-9]{6}Z$' || { echo "bad snapshot id: '$ts'" >&2; exit 1; }
          base="$R2_DOMAIN/danos-apt/$REPO_CHANNEL/snapshots/$ts"
          curl -fsSI --retry 5 --retry-delay 5 "$base/_READY" > /dev/null \
            || { echo "snapshot $ts has no _READY marker" >&2; exit 1; }
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "url=$base/" >> "$GITHUB_OUTPUT"
          echo "snapshot: $ts"

      - name: Build the ${{ matrix.variant }} ISO
        env:
          DANOS_APT_URL: ${{ steps.snap.outputs.url }}
          ISO_VARIANT: ${{ matrix.variant }}
          # The repository defaults are China mirrors; the runner is in the US.
          DEBIAN_MIRROR: http://deb.debian.org/debian/
          DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security/
          OUTPUT: ${{ github.workspace }}/out
        run: ./scripts/build-iso-container.sh

      - name: Check what was built
        run: |
          cd out
          iso=$(ls *.hybrid.iso)
          echo "iso: $iso"
          sha256sum "$iso" | tee "$iso.sha256.check"
          # The Robot suites require DANOS:Shipping:2608 in "show version"; the
          # image name carries the same release id (see auto/config).
          case "$iso" in i-danos_2608_*) ;; *) echo "unexpected image name: $iso" >&2; exit 1;; esac
          # The patched FRR must be the one in the image (toolkit/frr-patches).
          grep -E '^frr[[:space:]]' *.packages | tee /dev/stderr | grep -q danos \
            || { echo "frr in the image is not the patched build" >&2; exit 1; }

      # What the Robot suites read back as "DANOS:Shipping:2608" in "show version",
      # checked in the image itself so nobody has to download 600 MB to find out.
      - name: Check the version string inside the image
        run: |
          sudo apt-get install -y -qq xorriso squashfs-tools > /dev/null
          mkdir -p /tmp/live
          xorriso -osirrox on -indev out/*.hybrid.iso -extract /live/filesystem.squashfs /tmp/live/filesystem.squashfs 2>/dev/null
          id=$(unsquashfs -cat /tmp/live/filesystem.squashfs etc/os-release.vyatta-version | grep '^VYATTA_PROJECT_ID=')
          echo "$id"
          echo "$id" | grep -q '^VYATTA_PROJECT_ID="DANOS:Shipping:2608:[0-9]\{8\}"$' \
            || { echo "unexpected version string in the image" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: danos-iso-${{ matrix.variant }}-${{ steps.snap.outputs.ts }}
          path: |
            out/*.hybrid.iso
            out/*.sha256
            out/*.packages
            out/*.contents
          retention-days: 30
          if-no-files-found: error

  # Boots the product image under QEMU/KVM and reads "show version" back over
  # the serial console, the same acceptance close-the-loop.sh runs locally
  # (stage 5), using the same scripts from the toolkit repository.
  accept:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: i-danos/toolkit
          path: toolkit

      - uses: actions/download-artifact@v4
        with:
          pattern: danos-iso-product-*
          path: iso
          merge-multiple: true

      - name: Install QEMU and helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 socat python3 xorriso > /dev/null
          # /dev/kvm exists on the hosted runners but is not world-accessible.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "no /dev/kvm on this runner; cannot boot-test" >&2; exit 1; }

      - name: Boot and read back show version
        run: |
          set -u
          export OBS_DIR="$RUNNER_TEMP/obs"
          iso=$(ls "$PWD"/iso/*.hybrid.iso)
          # boot-vm.sh looks for the kernel and initrd in <iso dir>/binary/live
          mkdir -p iso/binary
          xorriso -osirrox on -indev "$iso" -extract /live iso/binary/live > /dev/null 2>&1
          bash toolkit/vm/boot-vm.sh "$iso" gha 12222 4096 > boot.log 2>&1 || true
          grep -q "console socket up" boot.log || { cat boot.log; echo "qemu did not start" >&2; exit 1; }
          run="$OBS_DIR/run/gha"
          socat -u UNIX-CONNECT:"$run/console.sock" - > "$run/console.log" 2>/dev/null &
          socat_pid=$!
          up=false
          for i in $(seq 1 60); do
            sleep 5
            if grep -q "login:" "$run/console.log" 2>/dev/null; then up=true; break; fi
            if grep -qiE "kernel panic|Emergency Mode" "$run/console.log" 2>/dev/null; then break; fi
          done
          kill "$socat_pid" 2>/dev/null || true; wait "$socat_pid" 2>/dev/null || true
          $up || { tail -40 "$run/console.log"; echo "never reached a login prompt" >&2; exit 1; }
          timeout 150 python3 toolkit/vm/console.py "$run/console.sock" tmpuser tmppwd \
            "show version | cat" "show interfaces | cat" 2>&1 | tr -d '\r' | tee transcript.log
          kill "$(cat "$run/qemu.pid")" 2>/dev/null || true
          grep -q '^Version:' transcript.log || { echo "no Version line" >&2; exit 1; }
          grep -q 'DANOS:Shipping:2608:' transcript.log || { echo "version string is not DANOS:Shipping:2608" >&2; exit 1; }
          grep -qE '^dp[0-9a-z]+ ' transcript.log || { echo "no dataplane interface listed" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accept-transcript
          path: |
            transcript.log
            boot.log
          if-no-files-found: ignore
          retention-days: 30

  # The Robot regression (BGP, IPsec, MPLS-LDP, firewall, REST, data-plane objects:
  # 81 cases) against the test image, topology by topology, as vm/regression.sh runs
  # it locally. Runs on the weekly schedule and when asked for. Memory per router is
  # lowered so four routers fit in the runner's 16 GB.
  regression:
    needs: build
    if: ${{ github.event_name == 'schedule' || github.event.inputs.regression == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      OBS_DIR: ${{ github.workspace }}/run
      MEM: '2560'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: i-danos/toolkit
          path: danos-sources/toolkit

      - uses: actions/checkout@v4
        with:
          repository: i-danos/tests
          path: danos-sources/tests

      - uses: actions/download-artifact@v4
        with:
          pattern: danos-iso-test-*
          path: iso
          merge-multiple: true

      - name: Install QEMU and helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 socat python3 xorriso > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "no /dev/kvm on this runner" >&2; exit 1; }
          # The runner image carries toolchains this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the Robot environment
        run: danos-sources/toolkit/vm/robot-env.sh up

      - name: Run the regression
        run: |
          iso=$(ls "$PWD"/iso/*.hybrid.iso)
          # boot-topo.sh wants the kernel and initrd in <iso dir>/binary/live
          mkdir -p iso/binary
          xorriso -osirrox on -indev "$iso" -extract /live iso/binary/live > /dev/null 2>&1
          mkdir -p "$OBS_DIR"
          set -o pipefail
          danos-sources/toolkit/vm/regression.sh "$iso" gha 2>&1 | tee regression.log
          grep -q '^  81 of 81' regression.log

      - name: Hand the results back to the runner user
        if: always()
        run: sudo chown -R "$USER" danos-sources/tests iso regression.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: |
            regression.log
            danos-sources/tests/Test_Automation/results-gha-*/output.xml
            danos-sources/tests/Test_Automation/results-gha-*/log.html
            danos-sources/tests/Test_Automation/results-gha-*/report.html
          if-no-files-found: warn
          retention-days: 30

  # Only when asked for. A scheduled run builds and boot-tests but does not
  # publish, so the Releases page holds builds someone chose. Only the product
  # image goes out: the test image carries a preseeded harness configuration.
  publish:
    needs: accept
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: danos-iso-product-*
          path: iso
          merge-multiple: true

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_RUN: ${{ github.run_id }}
        run: |
          cd iso
          iso=$(ls *.hybrid.iso)
          tag="v${iso#i-danos_}"; tag="${tag%-amd64.hybrid.iso}"
          sha256sum "$iso" > "$iso.sha256"
          {
            echo "DANOS 2608 (Lancaster) product image, **public test build, not for production**."
            echo
            echo "* Booted under QEMU/KVM by the build workflow before publication; \`show version\` reads \`DANOS:Shipping:2608\`. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SNAPSHOT_RUN}"
            echo "* Robot regression 81/81 on QEMU; also run on Celeron J1900 / Intel I211 hardware. Known limitations and what was not tested: docs/PUBLIC-TEST.md"
            echo "* Secure Boot needs the signing certificate enrolled through MOK: docs/secure-boot/"
            echo "* Live login \`tmpuser\` / \`tmppwd\` (live session only); \`install image\` sets your own administrator account."
            echo "* Licenses and source: LICENSING.md. Security reports: SECURITY.md."
            echo
            echo "Verify: \`sha256sum -c $iso.sha256\`"
          } > notes.md
          gh release create "$tag" "$iso" "$iso.sha256" *.packages \
            --prerelease --title "DANOS 2608 test build $tag" --notes-file notes.md
          echo "published $tag"
